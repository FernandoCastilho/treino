name: Publicar Treino (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'catalogue/**', 'api/coach/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Teste da tela de senha
        run: npx vitest run src/lib/gate.test.js
      - name: Build
        run: npm run build
        env:
          # Hash da senha (variável do repositório, não é segredo: o hash vai no site de qualquer jeito).
          VITE_SENHA_HASH: ${{ vars.SENHA_HASH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
